[project]
name = "cellestial-docs"
version = "0.44.0"
description = ""
authors = [
    { name = "Zaf4", email = "zafermolbio@gmail.com" },
]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<4.0"
dependencies = [
    "anndata>=0.10.8,<1.0",
    "cellestial>=0.44.0",
    "lets-plot>=4.10.0,<5.0.0",
    "polars[pyarrow]>=1.30.0,<2.0.0",
    "scikit-image>=0.23.1,<1.0",
    "spatialdata>=0.7,<1.0",
    "tqdm>=4",
]

[project.optional-dependencies]
extras = [
    "matplotlib>=3.9,<4.0",
    "scanpy[leiden]>=1.10.4,<2.0.0",
    "scvelo>=0.3.3,<0.4.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0,<8.0.0",
    "ruff>=0.15.12,<0.16.0",
    "mypy>=2.0.0,<3.0.0",
    "pooch>=1.8.2,<2.0.0",
    "scanpy[leiden]>=1.10.4,<2.0.0",
    "pycairo>=1.27.0,<2.0.0",
    "cairosvg>=2.7.1,<3.0.0",
    "scvelo>=0.3.3,<0.4.0",
    "ty>=0.0.34,<0.0.35",
    "pandas==2.2.2",
    "tqdm>=4.67.3,<5.0.0",
    "pytest>=9.0.3,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
]
docs = [
    "sphinx>=8.0.0",
    "pydata-sphinx-theme>=0.16.1,<0.17.0",
    "jupyter-sphinx>=0.5.3,<0.6.0",
    "ipython>=9.13.0,<10.0.0",
    "furo>=2025.12.19,<2026.0.0",
    "sphinx-copybutton>=0.5.2,<0.6.0",
    "sphinx-design>=0.7.0,<0.8.0",
    "squidpy>=1.8.1,<2.0.0",
    "ghp-import>=2.1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=cellestial --cov-report=term-missing"

[tool.coverage.run]
data_file = "tests/.coverage"
